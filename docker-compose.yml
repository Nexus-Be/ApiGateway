services:
  redis:
    image: redis:7-alpine
    container_name: nexus-gateway-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  gateway:
    build:
      context: ./Nexus.Gateway
      dockerfile: Dockerfile
    container_name: nexus-apigateway
    ports:
      - "8000:8000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Gateway__RedisConnectionString=redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
