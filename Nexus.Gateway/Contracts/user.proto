syntax = "proto3";
option csharp_namespace = "ShoppingCart.Contracts.V1";
package shoppingcart.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// Gateway and backend contract for comprehensive User, Auth, Profile, Seller and Admin management APIs.
service UserApi {
  // Auth additions
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc LogoutAll(LogoutAllRequest) returns (LogoutAllResponse);

  // Me & Personal profile
  rpc ListSessions(ListSessionsRequest) returns (SessionListResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  rpc GetMyProfile(GetMyProfileRequest) returns (MyProfileResponse);
  rpc UpdateMyProfile(UpdateMyProfileRequest) returns (MyProfileUpdatedResponse);
  rpc GetMyAvatar(GetMyAvatarRequest) returns (AvatarResponse);
  rpc UploadMyAvatar(UploadAvatarRequest) returns (AvatarUploadedResponse);
  rpc GetMyReputation(GetMyReputationRequest) returns (MyReputationResponse);
  rpc ListMyPenalties(ListMyPenaltiesRequest) returns (PenaltyListResponse);
  rpc ListMyReports(ListMyReportsRequest) returns (MyReportListResponse);

  // Public User & Seller queries
  rpc GetUserPublicProfile(GetUserPublicProfileRequest) returns (PublicUserProfileResponse);
  rpc GetUserAvatar(GetUserAvatarRequest) returns (AvatarResponse);
  rpc GetSellerPublicProfile(GetSellerPublicProfileRequest) returns (SellerPublicProfileResponse);
  rpc GetUserReputation(GetUserReputationRequest) returns (UserReputationResponse);
  rpc GetUserReputationHistory(GetUserReputationHistoryRequest) returns (ReputationHistoryResponse);
  rpc GetUserReviews(GetUserReviewsRequest) returns (UserReviewListResponse);

  // Reviews & Reports
  rpc UploadReviewFiles(UploadFilesRequest) returns (UploadFilesResponse);
  rpc CreateReview(CreateReviewRequest) returns (ReviewCreatedResponse);
  rpc UploadReportFiles(UploadFilesRequest) returns (UploadFilesResponse);
  rpc CreateUserReport(CreateUserReportRequest) returns (UserReportCreatedResponse);

  // Seller Registration & Shop profile
  rpc CreateSellerRegistration(CreateSellerRegistrationRequest) returns (SellerRegistrationCreatedResponse);
  rpc ResendSellerRegistrationOtp(ResendSellerRegistrationOtpRequest) returns (SellerRegistrationOtpResendResponse);
  rpc UploadSellerRegistrationDocuments(UploadSellerDocumentsRequest) returns (UploadFilesResponse);
  rpc VerifySellerOtp(VerifySellerOtpRequest) returns (VerifySellerOtpResponse);
  rpc GetSellerRegistrationStatus(GetSellerRegistrationStatusRequest) returns (SellerRegistrationStatusResponse);
  rpc GetSellerOwnProfile(GetSellerOwnProfileRequest) returns (SellerOwnProfileResponse);
  rpc UpdateSellerOwnProfile(UpdateSellerOwnProfileRequest) returns (SellerOwnProfileUpdatedResponse);

  // Admin & Staff operations
  rpc ListAdminSellerRegistrations(ListAdminSellerRegistrationsRequest) returns (AdminSellerRegistrationListResponse);
  rpc GetAdminSellerRegistrationDetail(GetAdminSellerRegistrationDetailRequest) returns (AdminSellerRegistrationDetailResponse);
  rpc ApproveSellerRegistration(ApproveSellerRegistrationRequest) returns (ApproveSellerRegistrationResponse);
  rpc RejectSellerRegistration(RejectSellerRegistrationRequest) returns (RejectSellerRegistrationResponse);
  rpc ListAdminReports(ListAdminReportsRequest) returns (AdminReportListResponse);
  rpc ResolveAdminReport(ResolveAdminReportRequest) returns (ResolveAdminReportResponse);
  rpc DismissAdminReport(DismissAdminReportRequest) returns (DismissAdminReportResponse);
  rpc HideAdminReview(HideAdminReviewRequest) returns (HideAdminReviewResponse);
  rpc ListAdminUsers(ListAdminUsersRequest) returns (AdminUserListResponse);
  rpc CreateAdminUser(CreateAdminUserRequest) returns (AdminUserCreatedResponse);
  rpc GetAdminUserDetail(GetAdminUserDetailRequest) returns (AdminUserDetailResponse);
  rpc UpdateAdminUser(UpdateAdminUserRequest) returns (AdminUserUpdatedResponse);
  rpc DeleteAdminUser(DeleteAdminUserRequest) returns (AdminUserDeletedResponse);
  rpc BanAdminUser(BanAdminUserRequest) returns (AdminUserBanResponse);
  rpc UnbanAdminUser(UnbanAdminUserRequest) returns (AdminUserUnbanResponse);
  rpc GetAdminSellerDetail(GetAdminSellerDetailRequest) returns (AdminSellerDetailResponse);
  rpc AssignAdminUserRoles(AssignAdminUserRolesRequest) returns (AdminUserRolesResponse);
  rpc AdjustAdminUserReputation(AdjustAdminUserReputationRequest) returns (AdminUserReputationResponse);
  rpc ListAdminRoles(ListAdminRolesRequest) returns (AdminRoleListResponse);
  rpc ListAdminPermissions(ListAdminPermissionsRequest) returns (AdminPermissionListResponse);
  rpc UpdateAdminRolePermissions(UpdateAdminRolePermissionsRequest) returns (AdminRolePermissionsUpdatedResponse);
  rpc ListAdminAuditLogs(ListAdminAuditLogsRequest) returns (AdminAuditLogListResponse);
  rpc ListAdminConfigs(ListAdminConfigsRequest) returns (AdminConfigListResponse);
  rpc UpdateAdminConfig(UpdateAdminConfigRequest) returns (AdminConfigUpdatedResponse);
}

// Common
message UserCallerContext {
  string user_id = 1;
  repeated string roles = 2;
}

message UserAddressDto {
  int32 province_id = 1;
  int32 district_id = 2;
  string ward_code = 3;
  string street_address = 4;
}

// ----------------- Auth Messages -----------------
message RefreshTokenRequest {
  string refresh_token = 1;
  string device_info = 2;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int32 expires_in = 3;
}

message ForgotPasswordRequest {
  string email = 1;
}

message ForgotPasswordResponse {
  string email = 1;
}

message ResetPasswordRequest {
  string email = 1;
  string otp_code = 2;
  string new_password = 3;
  string confirm_password = 4;
}

message ResetPasswordResponse {
  bool success = 1;
}

message ChangePasswordRequest {
  string old_password = 1;
  string new_password = 2;
  string confirm_password = 3;
  UserCallerContext caller = 4;
}

message ChangePasswordResponse {
  bool success = 1;
}

message LogoutRequest {
  string refresh_token = 1;
  UserCallerContext caller = 2;
}

message LogoutResponse {
  bool success = 1;
}

message LogoutAllRequest {
  UserCallerContext caller = 1;
}

message LogoutAllResponse {
  int32 count_revoked = 1;
}

// ----------------- Me Messages -----------------
message ListSessionsRequest {
  UserCallerContext caller = 1;
}

message SessionItem {
  string session_id = 1;
  string device_info = 2;
  string ip_address = 3;
  google.protobuf.Timestamp last_active_at = 4;
  bool is_current = 5;
}

message SessionListResponse {
  repeated SessionItem items = 1;
}

message RevokeSessionRequest {
  string session_id = 1;
  UserCallerContext caller = 2;
}

message RevokeSessionResponse {
  string revoked_session_id = 1;
}

message GetMyProfileRequest {
  UserCallerContext caller = 1;
}

message MyProfileResponse {
  string id = 1;
  string email = 2;
  optional string username = 3;
  string first_name = 4;
  string last_name = 5;
  string phone_number = 6;
  string avatar_url = 7;
  string address = 8;
  int32 reputation_score = 9;
  string trust_level = 10;
  repeated string roles = 11;
  repeated string permissions = 12;
  bool is_seller = 13;
  google.protobuf.Timestamp created_at = 14;
}

message UpdateMyProfileRequest {
  optional string username = 1;
  string first_name = 2;
  string last_name = 3;
  string phone_number = 4;
  UserAddressDto address = 5;
  UserCallerContext caller = 6;
}

message MyProfileUpdatedResponse {
  string id = 1;
  optional string username = 2;
  string first_name = 3;
  string last_name = 4;
  string phone_number = 5;
  string avatar_url = 6;
  string address = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message GetMyAvatarRequest {
  UserCallerContext caller = 1;
}

message AvatarResponse {
  string user_id = 1;
  string avatar_url = 2;
}

message UploadAvatarRequest {
  string file_name = 1;
  UserCallerContext caller = 2;
}

message AvatarUploadedResponse {
  string avatar_url = 1;
  google.protobuf.Timestamp updated_at = 2;
}

message GetMyReputationRequest {
  UserCallerContext caller = 1;
}

message MyReputationResponse {
  string user_id = 1;
  int32 reputation_score = 2;
  string trust_level = 3;
  bool can_bid = 4;
  bool can_sell = 5;
  int32 positive_rating_count = 6;
  int32 negative_rating_count = 7;
  int32 next_level_threshold = 8;
}

message ListMyPenaltiesRequest {
  int32 page = 1;
  int32 limit = 2;
  UserCallerContext caller = 3;
}

message PenaltyItem {
  string id = 1;
  string violation_type = 2;
  string reason = 3;
  string penalty_applied = 4;
  int32 points_deducted = 5;
  string status = 6;
  google.protobuf.Timestamp issued_at = 7;
  google.protobuf.Timestamp expires_at = 8;
}

message PenaltyListResponse {
  repeated PenaltyItem items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// ----------------- Public User & Seller Queries -----------------
message GetUserPublicProfileRequest {
  string user_id = 1;
}

message PublicUserProfileResponse {
  string id = 1;
  optional string username = 2;
  string first_name = 3;
  string last_name = 4;
  string avatar_url = 5;
  int32 reputation_score = 6;
  string trust_level = 7;
  repeated string badges = 8;
  bool is_seller = 9;
  google.protobuf.Timestamp joined_at = 10;
}

message GetUserAvatarRequest {
  string user_id = 1;
}

message GetSellerPublicProfileRequest {
  string seller_id = 1;
}

message SellerPublicProfileResponse {
  string seller_id = 1;
  string shop_name = 2;
  string avatar_url = 3;
  double rating_avg = 4;
  int32 total_reviews = 5;
  google.protobuf.Timestamp joined_at = 6;
}

message GetUserReputationRequest {
  string user_id = 1;
}

message UserReputationResponse {
  string user_id = 1;
  int32 reputation_score = 2;
  string trust_level = 3;
  repeated string badges = 4;
  bool can_bid = 5;
  bool can_sell = 6;
  int32 total_reviews = 7;
  double positive_ratio = 8;
}

message GetUserReputationHistoryRequest {
  string user_id = 1;
  int32 page = 2;
  int32 limit = 3;
  UserCallerContext caller = 4;
}

message ReputationHistoryItem {
  int32 id = 1;
  int32 change_amount = 2;
  int32 score_after = 3;
  string reason = 4;
  string reference_type = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ReputationHistoryResponse {
  repeated ReputationHistoryItem items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetUserReviewsRequest {
  string user_id = 1;
  int32 page = 2;
  int32 limit = 3;
  int32 filter_rating = 4;
}

message UserReviewItem {
  string id = 1;
  string reviewer_name = 2;
  int32 rating = 3;
  string comment = 4;
  repeated string media_urls = 5;
  google.protobuf.Timestamp created_at = 6;
}

message UserReviewListResponse {
  repeated UserReviewItem items = 1;
  double average_rating = 2;
  int32 total_reviews = 3;
  int32 total = 4;
  int32 page = 5;
  int32 page_size = 6;
}

// ----------------- Reviews & Reports -----------------
message UploadFilesRequest {
  repeated string file_names = 1;
  UserCallerContext caller = 2;
}

message UploadFilesResponse {
  repeated string file_urls = 1;
}

message CreateReviewRequest {
  string transaction_type = 1;
  string transaction_id = 2;
  string target_user_id = 3;
  int32 rating = 4;
  string comment = 5;
  repeated string media_urls = 6;
  UserCallerContext caller = 7;
}

message ReviewCreatedResponse {
  string review_id = 1;
  int32 new_target_reputation_score = 2;
}

message CreateUserReportRequest {
  string reported_user_id = 1;
  string violation_type = 2;
  string description = 3;
  repeated string evidence_urls = 4;
  UserCallerContext caller = 5;
}

message UserReportCreatedResponse {
  string report_id = 1;
  string status = 2;
  google.protobuf.Timestamp submitted_at = 3;
}

message ListMyReportsRequest {
  int32 page = 1;
  int32 limit = 2;
  string status = 3;
  UserCallerContext caller = 4;
}

message MyReportItem {
  string report_id = 1;
  string target_type = 2;
  string target_id = 3;
  string reason = 4;
  repeated string evidence_urls = 5;
  string status = 6;
  string admin_note = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp resolved_at = 9;
}

message MyReportListResponse {
  repeated MyReportItem items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// ----------------- Seller Registration & Shop Profile -----------------
message CreateSellerRegistrationRequest {
  string shop_name = 1;
  string business_email = 2;
  string hotline = 3;
  UserAddressDto warehouse_address = 4;
  string identity_card_number = 5;
  UserCallerContext caller = 6;
}

message SellerRegistrationCreatedResponse {
  string registration_id = 1;
  string status = 2;
  google.protobuf.Timestamp submitted_at = 3;
}

message ResendSellerRegistrationOtpRequest {
  string registration_id = 1;
  string business_email = 2;
  UserCallerContext caller = 3;
}

message SellerRegistrationOtpResendResponse {
  string registration_id = 1;
  int32 cooldown = 2;
}

message UploadSellerDocumentsRequest {
  string registration_id = 1;
  repeated string file_names = 2;
  UserCallerContext caller = 3;
}

message VerifySellerOtpRequest {
  string registration_id = 1;
  string otp_code = 2;
  UserCallerContext caller = 3;
}

message VerifySellerOtpResponse {
  string registration_id = 1;
  string status = 2;
}

message GetSellerRegistrationStatusRequest {
  UserCallerContext caller = 1;
}

message SellerRegistrationStatusResponse {
  string registration_id = 1;
  string status = 2;
  optional string rejection_reason = 3;
  google.protobuf.Timestamp submitted_at = 4;
}

message GetSellerOwnProfileRequest {
  UserCallerContext caller = 1;
}

message SellerOwnProfileResponse {
  string shop_id = 1;
  string shop_name = 2;
  string hotline = 3;
  string pickup_address = 4;
  string ghn_shop_id = 5;
  double rating_avg = 6;
  int32 total_products = 7;
}

message UpdateSellerOwnProfileRequest {
  optional string shop_name = 1;
  optional string hotline = 2;
  UserAddressDto pickup_address = 3;
  string description = 4;
  UserCallerContext caller = 5;
}

message SellerOwnProfileUpdatedResponse {
  string shop_id = 1;
  string shop_name = 2;
  google.protobuf.Timestamp updated_at = 3;
}

// ----------------- Admin Operations -----------------
message ListAdminSellerRegistrationsRequest {
  int32 page = 1;
  int32 limit = 2;
  string status = 3;
  UserCallerContext caller = 4;
}

message AdminSellerRegistrationItem {
  string registration_id = 1;
  string user_id = 2;
  string shop_name = 3;
  string identity_card_number = 4;
  string warehouse_address = 5;
  int32 reputation_score = 6;
}

message AdminSellerRegistrationListResponse {
  repeated AdminSellerRegistrationItem items = 1;
  int32 total = 2;
}

message GetAdminSellerRegistrationDetailRequest {
  string registration_id = 1;
  UserCallerContext caller = 2;
}

message AdminSellerRegistrationDetailResponse {
  string registration_id = 1;
  string user_id = 2;
  string shop_name = 3;
  string hotline = 4;
  string pickup_address = 5;
  string identity_card_number = 6;
  string id_card_front_url = 7;
  string id_card_back_url = 8;
  string business_license_url = 9;
  int32 reputation_score = 10;
  string status = 11;
  google.protobuf.Timestamp submitted_at = 12;
}

message ApproveSellerRegistrationRequest {
  string registration_id = 1;
  string note = 2;
  UserCallerContext caller = 3;
}

message ApproveSellerRegistrationResponse {
  string registration_id = 1;
  string user_id = 2;
  string status = 3;
  google.protobuf.Timestamp approved_at = 4;
}

message RejectSellerRegistrationRequest {
  string registration_id = 1;
  string rejection_reason = 2;
  UserCallerContext caller = 3;
}

message RejectSellerRegistrationResponse {
  string registration_id = 1;
  string status = 2;
  google.protobuf.Timestamp rejected_at = 3;
  string rejection_reason = 4;
}

message ListAdminReportsRequest {
  int32 page = 1;
  int32 limit = 2;
  string status = 3;
  string violation_type = 4;
  UserCallerContext caller = 5;
}

message AdminReportItem {
  string id = 1;
  string reporter_id = 2;
  string reported_user_id = 3;
  string violation_type = 4;
  string description = 5;
  repeated string evidence_urls = 6;
  string status = 7;
  google.protobuf.Timestamp created_at = 8;
}

message AdminReportListResponse {
  repeated AdminReportItem items = 1;
  int32 total = 2;
}

message ResolveAdminReportRequest {
  string report_id = 1;
  string action = 2;
  int32 points_deducted = 3;
  string resolution_note = 4;
  UserCallerContext caller = 5;
}

message ResolveAdminReportResponse {
  string report_id = 1;
  string status = 2;
  google.protobuf.Timestamp resolved_at = 3;
}

message DismissAdminReportRequest {
  string report_id = 1;
  string reason = 2;
  UserCallerContext caller = 3;
}

message DismissAdminReportResponse {
  string report_id = 1;
  string status = 2;
  google.protobuf.Timestamp dismissed_at = 3;
}

message HideAdminReviewRequest {
  string review_id = 1;
  string reason = 2;
  UserCallerContext caller = 3;
}

message HideAdminReviewResponse {
  string review_id = 1;
  bool is_hidden = 2;
}

message ListAdminUsersRequest {
  int32 page = 1;
  int32 limit = 2;
  string keyword = 3;
  string role = 4;
  string status = 5;
  UserCallerContext caller = 6;
}

message AdminUserItem {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string phone_number = 5;
  string status = 6;
  int32 reputation_score = 7;
  repeated string roles = 8;
}

message AdminUserListResponse {
  repeated AdminUserItem items = 1;
  int32 total = 2;
}

message CreateAdminUserRequest {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
  string phone_number = 5;
  repeated string role_codes = 6;
  UserCallerContext caller = 7;
}

message AdminUserCreatedResponse {
  string user_id = 1;
  string email = 2;
  repeated string roles = 3;
}

message GetAdminUserDetailRequest {
  string user_id = 1;
  UserCallerContext caller = 2;
}

message AdminUserDetailResponse {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string phone_number = 5;
  string status = 6;
  int32 reputation_score = 7;
  string trust_level = 8;
  repeated string roles = 9;
  repeated string permissions = 10;
  google.protobuf.Struct seller_profile = 11;
  google.protobuf.Timestamp created_at = 12;
  repeated google.protobuf.Struct audit_history = 13;
}

message UpdateAdminUserRequest {
  string user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string phone_number = 4;
  string status = 5;
  string reason = 6;
  UserCallerContext caller = 7;
}

message AdminUserUpdatedResponse {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string status = 4;
  string updated_by = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message DeleteAdminUserRequest {
  string user_id = 1;
  string reason = 2;
  UserCallerContext caller = 3;
}

message AdminUserDeletedResponse {
  string id = 1;
  bool is_deleted = 2;
  google.protobuf.Timestamp deleted_at = 3;
}

message BanAdminUserRequest {
  string user_id = 1;
  string reason = 2;
  int32 ban_duration_days = 3;
  UserCallerContext caller = 4;
}

message AdminUserBanResponse {
  string id = 1;
  string status = 2;
  google.protobuf.Timestamp banned_until = 3;
  string reason = 4;
}

message UnbanAdminUserRequest {
  string user_id = 1;
  string reason = 2;
  UserCallerContext caller = 3;
}

message AdminUserUnbanResponse {
  string id = 1;
  string status = 2;
  google.protobuf.Timestamp unbanned_at = 3;
}

message GetAdminSellerDetailRequest {
  string seller_id = 1;
  UserCallerContext caller = 2;
}

message AdminSellerDetailResponse {
  string seller_id = 1;
  string shop_name = 2;
  string owner_user_id = 3;
  string identity_card_number = 4;
  string pickup_address = 5;
  string status = 6;
  repeated google.protobuf.Struct audit_history = 7;
}

message AssignAdminUserRolesRequest {
  string user_id = 1;
  repeated string role_codes = 2;
  repeated int32 role_ids = 3;
  string reason = 4;
  UserCallerContext caller = 5;
}

message AdminUserRolesResponse {
  string user_id = 1;
  repeated string roles = 2;
  string updated_by = 3;
}

message AdjustAdminUserReputationRequest {
  string user_id = 1;
  int32 delta = 2;
  string reason = 3;
  UserCallerContext caller = 4;
}

message AdminUserReputationResponse {
  string user_id = 1;
  int32 previous_score = 2;
  int32 new_score = 3;
  int32 delta = 4;
  string trust_level = 5;
}

message ListAdminRolesRequest {
  UserCallerContext caller = 1;
}

message AdminRoleItem {
  int32 role_id = 1;
  string role_name = 2;
  string description = 3;
  bool is_system_role = 4;
  int32 permissions_count = 5;
}

message AdminRoleListResponse {
  repeated AdminRoleItem items = 1;
}

message ListAdminPermissionsRequest {
  UserCallerContext caller = 1;
}

message AdminPermissionItem {
  int32 permission_id = 1;
  string permission_code = 2;
  string module = 3;
  string description = 4;
}

message AdminPermissionListResponse {
  repeated AdminPermissionItem items = 1;
}

message UpdateAdminRolePermissionsRequest {
  int32 role_id = 1;
  string description = 2;
  repeated int32 permission_ids = 3;
  UserCallerContext caller = 4;
}

message AdminRolePermissionsUpdatedResponse {
  int32 role_id = 1;
  int32 updated_permissions_count = 2;
}

message ListAdminAuditLogsRequest {
  int32 page = 1;
  int32 limit = 2;
  string actor_id = 3;
  string action = 4;
  string from_date = 5;
  string to_date = 6;
  UserCallerContext caller = 7;
}

message AdminAuditLogItem {
  string id = 1;
  string actor_id = 2;
  string action = 3;
  string target_entity = 4;
  google.protobuf.Struct old_values = 5;
  google.protobuf.Struct new_values = 6;
  string reason = 7;
  string ip_address = 8;
  google.protobuf.Timestamp created_at = 9;
}

message AdminAuditLogListResponse {
  repeated AdminAuditLogItem items = 1;
  int32 total = 2;
}

message ListAdminConfigsRequest {
  UserCallerContext caller = 1;
}

message AdminConfigItem {
  string key = 1;
  string value = 2;
  string description = 3;
  string data_type = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message AdminConfigListResponse {
  repeated AdminConfigItem items = 1;
}

message UpdateAdminConfigRequest {
  string key = 1;
  string value = 2;
  string reason = 3;
  UserCallerContext caller = 4;
}

message AdminConfigUpdatedResponse {
  string key = 1;
  string old_value = 2;
  string new_value = 3;
  google.protobuf.Timestamp updated_at = 4;
}
