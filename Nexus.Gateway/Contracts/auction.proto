syntax = "proto3";
option csharp_namespace = "ShoppingCart.Contracts.V1";
package shoppingcart.v1;

import "google/protobuf/struct.proto";

// Auction service contract exposed through the Gateway.
// Source of truth: apicontract_Auction.xlsx (sheet "F3. đấu giá").
// Additive only: shop.proto is not modified.
//
// Conventions
// - Money fields are double (HTTP contract uses "number").
// - Date-time fields are ISO 8601 strings.
// - AuctionStatus is a string: DRAFT, SCHEDULED, RUNNING, ENDED, SETTLED, FAILED, CANCELLED.
// - Numeric/bool fields are "optional" so that 0 and false are still serialized
//   (JsonFormatter drops proto3 default values otherwise) and null can be represented.
// - Caller identity and roles travel in gRPC metadata (x-user-id, x-user-roles).

service AuctionApi {
  rpc ListAuctions(ListAuctionsRequest) returns (AuctionListResponse);                     // AUC-01
  rpc GetAuction(AuctionIdRequest) returns (AuctionDetailResponse);                        // AUC-02
  rpc ListAuctionBids(ListAuctionBidsRequest) returns (BidListResponse);                   // AUC-03
  rpc PlaceBid(PlaceBidRequest) returns (PlaceBidResponse);                                // AUC-07
  rpc ListMyBids(ListMyBidsRequest) returns (MyBidListResponse);                           // AUC-08
  rpc GetAuctionResult(AuctionIdRequest) returns (AuctionResultResponse);                  // AUC-09
  rpc CreateAuction(CreateAuctionRequest) returns (AuctionCreatedResponse);                // AUC-10
  rpc UpdateAuction(UpdateAuctionRequest) returns (AuctionUpdatedResponse);                // AUC-11
  rpc CancelAuction(CancelAuctionRequest) returns (AuctionCancelResponse);                 // AUC-12
  rpc RecreateAuction(RecreateAuctionRequest) returns (AuctionRecreatedResponse);          // AUC-13
  rpc ListSellerAuctions(ListAuctionsRequest) returns (AuctionListResponse);               // AUC-14
  rpc ForceCancelAuction(ForceCancelAuctionRequest) returns (AuctionForceCancelResponse);  // AUC-15
  rpc ListAuctionConfigs(ListAuctionConfigsRequest) returns (AuctionConfigListResponse);   // AUC-16
  rpc UpdateAuctionConfig(UpdateAuctionConfigRequest) returns (AuctionConfigResponse);     // AUC-17
  rpc GetAuctionStatusHistory(AuctionIdRequest) returns (AuctionStatusHistoryResponse);    // AUC-18
  rpc GetAuctionSaga(AuctionIdRequest) returns (AuctionSagaResponse);                      // AUC-19
}

// ---------- Shared requests ----------
message AuctionIdRequest { string auction_id = 1; }

message ListAuctionsRequest {
  int32 page = 1;
  int32 page_size = 2;
  optional string status = 3;
}

// ---------- AUC-01 / AUC-14: list auctions (public list and seller list) ----------
message AuctionSummary {
  string auction_id = 1;
  string product_id = 2;
  string sku_id = 3;
  string seller_id = 4;
  string product_name = 5;
  optional string primary_image_url = 6;
  string status = 7;
  optional double start_price_amount = 8;
  optional double current_price_amount = 9;
  optional int32 bid_count = 10;
  string scheduled_start_at = 11;
  string scheduled_end_at = 12;
  string created_at = 13; // Only present in the seller list (AUC-14)
}

message AuctionListResponse {
  repeated AuctionSummary items = 1;
  optional int32 total = 2;
  optional int32 page = 3;
  optional int32 page_size = 4;
}

// ---------- AUC-02: auction detail ----------
message AuctionImage {
  string url = 1;
  optional bool is_primary = 2;
}

message AuctionDetailResponse {
  string auction_id = 1;
  string product_id = 2;
  string sku_id = 3;
  string seller_id = 4;
  string product_name = 5;
  optional string description = 6;
  repeated AuctionImage images = 7;
  google.protobuf.Struct specifications = 8;
  string status = 9;
  optional double start_price_amount = 10;
  optional double bid_step_amount = 11;
  optional double current_price_amount = 12;
  optional int32 bid_count = 13;
  optional string leading_bidder_display_name = 14;
  string scheduled_start_at = 15;
  string original_end_at = 16;
  string scheduled_end_at = 17;
  optional string started_at = 18;
  optional string ended_at = 19;
  optional int32 extension_count = 20;
  optional int32 max_extension_count = 21;
  optional int32 anti_sniping_extension_minutes = 22;
  optional int32 min_reputation_to_bid = 23;
  optional string recreated_from_auction_id = 24;
  string created_at = 25;
}

// ---------- AUC-10: create auction ----------
message CreateAuctionRequest {
  string product_id = 1;
  string sku_id = 2;
  optional double start_price_amount = 3;
  optional double bid_step_amount = 4;
  string scheduled_start_at = 5;
  string scheduled_end_at = 6;
}

message AuctionCreatedResponse {
  string auction_id = 1;
  string product_id = 2;
  string sku_id = 3;
  string product_name = 4;
  string status = 5;
  optional double start_price_amount = 6;
  optional double bid_step_amount = 7;
  string scheduled_start_at = 8;
  string scheduled_end_at = 9;
  optional int32 min_reputation_to_bid = 10;
  optional int32 anti_sniping_extension_minutes = 11;
  optional int32 max_extension_count = 12;
  string created_at = 13;
}

// ---------- AUC-11: update auction ----------
message UpdateAuctionRequest {
  string auction_id = 1;
  optional double start_price_amount = 2;
  optional double bid_step_amount = 3;
  optional string scheduled_start_at = 4;
  optional string scheduled_end_at = 5;
}

message AuctionUpdatedResponse {
  string auction_id = 1;
  string status = 2;
  optional double start_price_amount = 3;
  optional double bid_step_amount = 4;
  string scheduled_start_at = 5;
  string scheduled_end_at = 6;
  string updated_at = 7;
}

// ---------- AUC-12: seller cancels auction ----------
message CancelAuctionRequest {
  string auction_id = 1;
  optional string reason = 2;
}

message AuctionCancelResponse {
  string auction_id = 1;
  string from_status = 2;
  string status = 3;
  optional string reason = 4;
  string cancelled_at = 5;
}

// ---------- AUC-13: recreate auction from a FAILED one ----------
message RecreateAuctionRequest {
  string auction_id = 1; // The old (FAILED) auction
  optional double start_price_amount = 2;
  optional double bid_step_amount = 3;
  string scheduled_start_at = 4;
  string scheduled_end_at = 5;
}

message AuctionRecreatedResponse {
  string auction_id = 1; // The new auction
  string recreated_from_auction_id = 2;
  string product_id = 3;
  string sku_id = 4;
  string status = 5;
  optional double start_price_amount = 6;
  optional double bid_step_amount = 7;
  string scheduled_start_at = 8;
  string scheduled_end_at = 9;
  string created_at = 10;
}

// ---------- AUC-18: status history ----------
message AuctionStatusHistoryItem {
  string id = 1;
  optional string from_status = 2;
  string to_status = 3;
  optional string reason = 4;
  optional string changed_by = 5;
  string changed_at = 6;
}

message AuctionStatusHistoryResponse {
  string auction_id = 1;
  repeated AuctionStatusHistoryItem items = 2;
}

// ---------- AUC-15: admin force-cancel ----------
message ForceCancelAuctionRequest {
  string auction_id = 1;
  string reason = 2;
}

message AuctionForceCancelResponse {
  string auction_id = 1;
  string from_status = 2;
  string status = 3;
  string reason = 4;
  string cancelled_by = 5;
  string cancelled_at = 6;
}

// ---------- AUC-19: admin saga tracking ----------
message AuctionSagaResponse {
  string auction_id = 1;
  string saga_type = 2;
  string current_state = 3;
  google.protobuf.Struct state_data = 4;
  string created_at = 5;
  string updated_at = 6;
}

// ---------- AUC-16 / AUC-17: auction configs ----------
message ListAuctionConfigsRequest {}

message AuctionConfigItem {
  string config_key = 1;
  google.protobuf.Value config_value = 2;
  optional string description = 3;
  optional int32 version = 4;
  optional string updated_by = 5;
  string updated_at = 6;
}

message AuctionConfigListResponse {
  repeated AuctionConfigItem items = 1;
}

message UpdateAuctionConfigRequest {
  string key = 1;
  google.protobuf.Value config_value = 2;
  optional string description = 3;
}

message AuctionConfigResponse {
  string config_key = 1;
  google.protobuf.Value config_value = 2;
  optional string description = 3;
  optional int32 version = 4;
  optional bool is_active = 5;
  optional string updated_by = 6;
  string created_at = 7;
  string updated_at = 8;
}

// ---------- AUC-07: place bid ----------
message PlaceBidRequest {
  string auction_id = 1;
  optional double amount = 2;
  string if_match = 3; // HTTP If-Match header (row version). Idempotency-Key is forwarded as gRPC metadata.
}

message PlaceBidResponse {
  string bid_id = 1;
  string auction_id = 2;
  optional int32 bid_seq = 3;
  optional double amount = 4;
  string placed_at = 5;
  optional double current_price_amount = 6;
  optional int32 bid_count = 7;
  string scheduled_end_at = 8;
  optional int32 extension_count = 9;
}

// ---------- AUC-03: bid history of an auction ----------
message ListAuctionBidsRequest {
  string auction_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message BidItem {
  string bid_id = 1;
  optional int32 sequence_no = 2;
  string bidder_id = 3;
  string bidder_display_name = 4;
  optional double amount = 5;
  string placed_at = 6;
  optional bool is_outbid = 7;
  optional bool is_winning = 8;
  optional bool is_invalidated = 9;
}

message BidListResponse {
  repeated BidItem items = 1;
  optional int32 total = 2;
  optional int32 page = 3;
  optional int32 page_size = 4;
}

// ---------- AUC-08: my bids ----------
message ListMyBidsRequest {
  int32 page = 1;
  int32 page_size = 2;
  optional string status = 3;
}

message MyBidItem {
  string auction_id = 1;
  string product_id = 2;
  string product_name = 3;
  optional string primary_image_url = 4;
  string auction_status = 5;
  optional double my_highest_bid_amount = 6;
  optional double current_price_amount = 7;
  optional bool is_leading = 8;
  string ends_at = 9;
  string last_bid_at = 10;
}

message MyBidListResponse {
  repeated MyBidItem items = 1;
  optional int32 total = 2;
  optional int32 page = 3;
  optional int32 page_size = 4;
}

// ---------- AUC-09: auction result ----------
message AuctionResultResponse {
  string auction_id = 1;
  string status = 2;
  optional bool has_winner = 3;
  optional string winner_id = 4;
  optional string winner_display_name = 5;
  string seller_id = 6;
  optional string winning_bid_id = 7;
  optional double final_price_amount = 8;
  string determined_at = 9;
  optional string order_id = 10;
  optional string payment_deadline_at = 11;
  optional string paid_at = 12;
}
